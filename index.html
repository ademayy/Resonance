<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resonance — Wireframe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            zinc: {
              950: '#09090b',
              900: '#121214',
              850: '#18181b',
              800: '#27272a',
              700: '#3f3f46',
              400: '#a1a1aa',
              100: '#f4f4f5'
            },
            purple: {
              accent: '#a855f7',
              hover: '#9333ea',
              muted: 'rgba(168, 85, 247, 0.12)'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
    }

    .solid-border {
      border: 1px solid #27272a;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #09090b;
    }

    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }
  </style>
</head>

<body
  class="min-h-screen bg-[#09090b] text-[#f4f4f5] flex flex-col justify-between selection:bg-[#a855f7] selection:text-white">

  <!-- Container -->
  <div class="flex flex-col h-screen max-w-[1720px] w-full mx-auto p-4 md:p-6 overflow-hidden">

    <!-- Top Header -->
    <header class="bg-[#121214] solid-border rounded-xl h-16 px-6 mb-4 flex items-center justify-between flex-shrink-0">

      <!-- Brand & Title -->
      <div class="flex items-center space-x-3.5">
        <div class="w-8 h-8 rounded-lg bg-[#a855f7] flex items-center justify-center text-white">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 10v3" />
            <path d="M6 6v11" />
            <path d="M10 3v18" />
            <path d="M14 8v7" />
            <path d="M18 5v13" />
            <path d="M22 10v4" />
          </svg>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <span class="text-base font-semibold text-[#f4f4f5] tracking-tight">Resonance</span>
            <span class="text-[11px] font-medium px-2 py-0.5 rounded bg-[#18181b] solid-border text-[#a1a1aa]">Toronto
              Edition</span>
          </div>
          <p class="text-xs text-[#a1a1aa] mt-0.5">Toronto Gig Trail • Oct 9 – Nov 9</p>
        </div>
      </div>

      <!-- Category Filter Tabs -->
      <div
        class="hidden md:flex items-center space-x-1 bg-[#18181b] p-1 rounded-lg solid-border text-xs font-medium text-[#a1a1aa]">
        <button class="nav-tab active px-3.5 py-1.5 rounded-md bg-[#27272a] text-[#f4f4f5] transition-colors"
          data-filter="all">All Gigs</button>
        <button class="nav-tab px-3.5 py-1.5 rounded-md hover:text-[#f4f4f5] transition-colors" data-filter="west">West
          End</button>
        <button class="nav-tab px-3.5 py-1.5 rounded-md hover:text-[#f4f4f5] transition-colors"
          data-filter="downtown">Downtown</button>
        <button class="nav-tab px-3.5 py-1.5 rounded-md hover:text-[#f4f4f5] transition-colors"
          data-filter="weekend">This Weekend</button>
      </div>

      <!-- Spotify User Status Badge -->
      <div class="flex items-center space-x-3">
        <div class="flex items-center space-x-2 px-3 py-1.5 rounded-lg bg-[#18181b] solid-border text-xs">
          <div class="w-2 h-2 rounded-full bg-[#22c55e]"></div>
          <span class="text-[#a1a1aa]">Connected via Spotify</span>
          <span class="text-[#3f3f46]">•</span>
          <span class="font-semibold text-[#a855f7]">98% Match</span>
        </div>
        <div
          class="w-8 h-8 rounded-lg bg-[#18181b] solid-border flex items-center justify-center text-xs font-medium text-[#f4f4f5]">
          AJ
        </div>
      </div>

    </header>

    <!-- Main Split-Screen Workspace -->
    <main class="flex-1 flex flex-col lg:flex-row gap-4 overflow-hidden">

      <!-- LEFT SIDE: Tour Dates & Gig Feed (45% width) -->
      <section class="w-full lg:w-[45%] flex flex-col bg-[#121214] solid-border rounded-xl overflow-hidden">

        <!-- Search & Count Header -->
        <div class="p-4 border-b border-[#27272a] space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-[#a1a1aa]">Curated Tour Dates</h2>
            <span id="gig-count-pill" class="text-xs px-2.5 py-1 rounded bg-[#18181b] solid-border text-[#a1a1aa]">
              6 Shows
            </span>
          </div>

          <!-- Simplified Search Input -->
          <div class="relative flex items-center">
            <svg class="w-4 h-4 text-[#a1a1aa] absolute left-3 pointer-events-none" fill="none" stroke="currentColor"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input id="search-input" type="text" placeholder="Search"
              class="w-full pl-9 pr-3 py-2 rounded-lg bg-[#18181b] solid-border text-sm text-[#f4f4f5] placeholder-[#a1a1aa] focus:outline-none focus:border-[#a855f7] transition-colors" />
          </div>
        </div>

        <!-- Tour Dates List -->
        <div id="gig-list" class="flex-1 overflow-y-auto p-4 space-y-2.5">
          <!-- Populated by JavaScript with generic wireframe placeholders -->
        </div>

      </section>

      <!-- RIGHT SIDE: Minimalist Map & Detail Showcase (55% width) -->
      <section class="w-full lg:w-[55%] flex flex-col gap-4 overflow-hidden">

        <!-- Minimalist MAP Container (Centered Minimalist Text Header) -->
        <div
          class="flex-1 bg-[#18181b] solid-border rounded-xl flex items-center justify-center p-6 relative overflow-hidden">
          <h2 class="text-sm sm:text-base font-medium tracking-widest text-[#a1a1aa] uppercase select-none">
            MAP
          </h2>
        </div>

        <!-- Bottom Detail Card -->
        <div id="artist-detail-card" class="bg-[#121214] solid-border rounded-xl p-5 flex-shrink-0">
          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">

            <!-- Left Info Block with Dark Gray Placeholder Box -->
            <div class="flex items-center space-x-4 min-w-0">
              <div
                class="w-16 h-16 rounded-lg bg-[#27272a] solid-border flex items-center justify-center flex-shrink-0 text-[#71717a]">
                <svg class="w-7 h-7 text-[#71717a]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <rect width="18" height="18" x="3" y="3" rx="2" stroke-width="1.5" />
                  <path d="M3 15l5-5 4 4 3-3 6 6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </div>

              <div class="space-y-1 min-w-0">
                <div class="flex items-center space-x-2">
                  <h3 id="detail-title" class="text-lg font-bold text-[#f4f4f5] tracking-tight truncate">Artist name
                  </h3>
                  <span id="detail-match-badge"
                    class="px-2 py-0.5 rounded bg-purple-muted text-[#a855f7] border border-[#a855f7]/30 text-xs font-semibold flex-shrink-0">
                    98% Match
                  </span>
                </div>
                <p id="detail-venue" class="text-xs text-[#a1a1aa] truncate">Venue, Address</p>
                <p id="detail-date-price" class="text-xs text-[#71717a]">Date • Price</p>
                <div class="flex items-center space-x-2 text-[11px] text-[#a1a1aa] pt-0.5">
                  <span class="w-2 h-2 rounded-full bg-[#22c55e]"></span>
                  <span id="detail-friends">3 Spotify friends going</span>
                </div>
              </div>
            </div>

            <!-- Right CTA Button -->
            <a id="ticket-button" href="https://www.ticketmaster.ca" target="_blank"
              class="w-full sm:w-auto px-5 py-2.5 rounded-lg bg-[#a855f7] hover:bg-[#9333ea] text-white text-xs font-semibold tracking-wide flex items-center justify-center space-x-2 transition-colors flex-shrink-0">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
              </svg>
              <span>Get Tickets via Ticketmaster</span>
            </a>

          </div>
        </div>

      </section>

    </main>

  </div>

  <!-- JavaScript -->
  <script>
    // Generic Wireframe Dataset
    const wireframeGigs = [
      { id: 1, matchScore: 98, area: "west", friendsGoing: 3 },
      { id: 2, matchScore: 98, area: "west", friendsGoing: 5 },
      { id: 3, matchScore: 95, area: "downtown", friendsGoing: 2 },
      { id: 4, matchScore: 94, area: "downtown", friendsGoing: 6 },
      { id: 5, matchScore: 92, area: "downtown", friendsGoing: 4 },
      { id: 6, matchScore: 91, area: "weekend", friendsGoing: 8 }
    ];

    // State
    let selectedGigId = 1;
    let activeFilter = 'all';
    let searchQuery = '';

    // DOM Elements
    const gigListEl = document.getElementById('gig-list');
    const gigCountPill = document.getElementById('gig-count-pill');
    const searchInput = document.getElementById('search-input');
    const detailTitle = document.getElementById('detail-title');
    const detailMatchBadge = document.getElementById('detail-match-badge');
    const detailVenue = document.getElementById('detail-venue');
    const detailDatePrice = document.getElementById('detail-date-price');
    const detailFriends = document.getElementById('detail-friends');
    const ticketButton = document.getElementById('ticket-button');

    // Filter Function
    function getFilteredGigs() {
      return wireframeGigs.filter(gig => {
        const matchesFilter = activeFilter === 'all' || gig.area === activeFilter;
        const matchesSearch =
          searchQuery === '' ||
          "artist name".includes(searchQuery.toLowerCase()) ||
          "venue, address".includes(searchQuery.toLowerCase()) ||
          "date • price".includes(searchQuery.toLowerCase()) ||
          `${gig.matchScore}%`.includes(searchQuery);
        return matchesFilter && matchesSearch;
      });
    }

    // Render Left Side Wireframe Tour Dates
    function renderGigList() {
      const gigs = getFilteredGigs();
      gigListEl.innerHTML = '';
      gigCountPill.textContent = `${gigs.length} ${gigs.length === 1 ? 'Show' : 'Shows'}`;

      if (gigs.length === 0) {
        gigListEl.innerHTML = `
          <div class="py-12 text-center text-[#71717a] text-xs">
            <p>No results found.</p>
          </div>
        `;
        return;
      }

      gigs.forEach(gig => {
        const isSelected = gig.id === selectedGigId;

        const card = document.createElement('div');
        card.className = `p-3.5 rounded-lg solid-border cursor-pointer transition-colors ${isSelected ? 'bg-[#18181b] border-[#a855f7]' : 'bg-[#121214] hover:bg-[#18181b] hover:border-[#3f3f46]'
          }`;

        card.innerHTML = `
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-start space-x-3 min-w-0">
              <!-- Dark Gray Placeholder Box -->
              <div class="w-11 h-11 rounded bg-[#27272a] solid-border flex items-center justify-center flex-shrink-0 text-[#71717a]">
                <svg class="w-5 h-5 text-[#71717a]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <rect width="18" height="18" x="3" y="3" rx="2" stroke-width="1.5"/>
                  <path d="M3 15l5-5 4 4 3-3 6 6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
              <div class="min-w-0">
                <div class="flex items-center space-x-2">
                  <h3 class="text-sm font-semibold text-[#f4f4f5] truncate">Artist name</h3>
                  <span class="text-[10px] font-semibold text-[#a855f7] bg-purple-muted px-1.5 py-0.5 rounded border border-[#a855f7]/30 flex-shrink-0">
                    ${gig.matchScore}%
                  </span>
                </div>
                <p class="text-xs text-[#a1a1aa] mt-0.5 truncate">Venue, Address</p>
                <p class="text-[11px] text-[#71717a] mt-0.5">Date • Price</p>
              </div>
            </div>

            <!-- Non-functional Preview Button -->
            <button class="preview-btn px-2.5 py-1 rounded text-xs font-medium solid-border bg-[#18181b] text-[#71717a] flex-shrink-0 flex items-center space-x-1.5 pointer-events-none cursor-default select-none">
              <svg class="w-3 h-3 text-[#71717a]" fill="currentColor" viewBox="0 0 20 20">
                <path d="M6.3 2.841A1.5 1.5 0 004 4.11v11.78a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/>
              </svg>
              <span>Preview</span>
            </button>
          </div>
        `;

        card.addEventListener('click', () => {
          selectGig(gig.id);
        });

        gigListEl.appendChild(card);
      });
    }

    // Select Item Function
    function selectGig(id) {
      selectedGigId = id;
      const gig = wireframeGigs.find(g => g.id === id);
      if (!gig) return;

      // Update Bottom Detail Card with generic placeholder text
      detailTitle.textContent = "Artist name";
      detailMatchBadge.textContent = `${gig.matchScore}% Match`;
      detailVenue.textContent = "Venue, Address";
      detailDatePrice.textContent = "Date • Price";
      detailFriends.textContent = `${gig.friendsGoing} Spotify friends going`;
      ticketButton.href = "https://www.ticketmaster.ca";

      renderGigList();
    }

    // Category Tabs Filter
    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.nav-tab').forEach(t => {
          t.classList.remove('bg-[#27272a]', 'text-[#f4f4f5]');
          t.classList.add('text-[#a1a1aa]');
        });
        tab.classList.add('bg-[#27272a]', 'text-[#f4f4f5]');
        tab.classList.remove('text-[#a1a1aa]');
        activeFilter = tab.dataset.filter;
        renderGigList();
      });
    });

    // Search Input Event
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderGigList();
    });

    // Initialize View
    renderGigList();
    selectGig(1);
  </script>
</body>

</html>
